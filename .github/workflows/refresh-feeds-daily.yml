name: Refresh feeds

# Runs at 12:00 PM Pacific every day. GitHub Actions cron is UTC-only —
# 19:00 UTC = 12:00 PDT (summer); during PST (winter) this fires at 11 AM
# Pacific. Close enough for a daily rebuild.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

# Needed so the keepalive step below can push an empty commit.
permissions:
  contents: write

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping"
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo
          echo "Render deploy triggered."

  # GitHub disables scheduled workflows after 60 days with no repo activity,
  # which silently stopped the daily feed refresh in June 2026. If the last
  # commit is more than 45 days old, push an empty commit to keep it alive.
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push an empty commit if the repo has been quiet for 45+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was $age_days days ago."
          if [ "$age_days" -lt 45 ]; then
            echo "Recent enough; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive so scheduled feed refresh stays enabled"
          git push
